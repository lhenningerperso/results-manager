services:
  postgres:
    image: postgres:17
    container_name: results-manager-postgres
    environment:
      POSTGRES_DB: results_manager_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-rm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results_manager -d results_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data-rm: